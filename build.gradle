import org.box2d.jni.BuildSrc

allprojects {
    group = 'org.box2d.jni'
    version = "${jjVersion}"
}

subprojects {
    if ( BuildSrc.isDesktopProject(project) ) {
        apply plugin: 'java'            // to build JVM
        apply plugin: 'java-library'    // to build JVM libraries
        apply plugin: 'application'     // to build JVM applications
    }

    if ( BuildSrc.isIOSProject(project) ) {
        java {
            sourceCompatibility = JavaVersion.VERSION_1_8
            targetCompatibility = JavaVersion.VERSION_1_8
        }
    } else {
        java {
            sourceCompatibility = JavaVersion.VERSION_11
            targetCompatibility = JavaVersion.VERSION_11
        }
    }
}
