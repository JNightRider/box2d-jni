## Catalog of libraries and plugins used to build and run the Box2d-JNI project

[versions]
junit4       = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
runner       = "1.7.0"
rules        = "1.7.0"

[libraries]
junit4 = { module = "junit:junit", version.ref = "junit4" }

android-ext-junit     = { group = "androidx.test.ext",      name = "junit",         version.ref = "junitVersion" }
android-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
android-test-runner   = { group = "androidx.test",          name = "runner",        version.ref = "runner"       }
android-test-rules    = { group = "androidx.test",          name = "rules",         version.ref = "rules"        }

[bundles]

[plugins]
android-library = { id = "com.android.library",    version = "9.3.2" }
download        = { id = "de.undercouch.download", version = "5.7.0" }
